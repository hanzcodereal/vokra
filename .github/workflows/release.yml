name: Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (contoh: v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable

      - name: Pub get
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build release APK (arm64 + armeabi)
        run: |
          flutter build apk --release \
            --target-platform android-arm64,android-arm

      - name: Rename APKs
        run: |
          cd build/app/outputs/flutter-apk/
          mv app-arm64-v8a-release.apk vokra-${{ github.event.inputs.version }}-arm64-v8a.apk
          mv app-armeabi-v7a-release.apk vokra-${{ github.event.inputs.version }}-armeabi-v7a.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: Vokra ${{ github.event.inputs.version }}
          files: |
            build/app/outputs/flutter-apk/vokra-${{ github.event.inputs.version }}-arm64-v8a.apk
            build/app/outputs/flutter-apk/vokra-${{ github.event.inputs.version }}-armeabi-v7a.apk
          draft: false
          prerelease: false
